# <Project> CI — GitLab
#
# Lint jobs run unconditionally. The app jobs (`app-test`, `app-build`) compile
# the web app and run its unit tests on node 24, matching the Vercel build.
# Addons append their own test/build jobs through a .gitlab-ci.yml.append
# fragment; when an addon adds jobs, uncomment the corresponding stage below
# and follow the addon's manual merge notes.

stages:
  - lint
  - test
  - build

variables:
  GIT_DEPTH: "0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ───────────────────────────── lint ─────────────────────────────

commitlint:
  stage: lint
  image: node:20
  script:
    - npm install --no-save @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA" --verbose
      else
        npx commitlint --last --verbose
      fi

markdownlint:
  stage: lint
  image: node:20
  script:
    - npm install --no-save markdownlint-cli@0.41.0
    - npx markdownlint "docs/**/*.md" "*.md"
        --ignore "docs/archive"

# Record registry: owner-qualified IDs unique, filename == id, every status matching its
# folder, and every generated index equal to a regeneration. This is the enforcement that
# keeps "find before create / claim don't duplicate" honest.
# Needs node: the checks run in @scaffold/records, which tools/check-records.sh shims onto.
records:
  stage: lint
  image: node:20
  script:
    - sh tools/check-records.sh

# ───────────────────────────── test / build ─────────────────────────────

# App unit tests over the pure logic (vitest; TASK-QA-VITTORIOGIORDANOYBQ-001).
app-test:
  stage: test
  image: node:24
  cache:
    key:
      files:
        - app/package-lock.json
    paths:
      - app/node_modules/
  script:
    - cd app
    - npm ci
    - npm run test

# The production build must compile before it reaches main
# (TASK-CI-VITTORIOGIORDANOYBQ-001); Vercel publishes on push, so a type error
# must fail here instead.
app-build:
  stage: build
  image: node:24
  cache:
    key:
      files:
        - app/package-lock.json
    paths:
      - app/node_modules/
  script:
    - cd app
    - npm ci
    - npm run build

# Scaffold updates and policy: the full `status` report (upgrades, policy
# findings) against the registry. Needs the runner to reach the npm registry
# that serves the engine and addon packages, so it is opt-in: uncomment once
# the runner can reach it.
